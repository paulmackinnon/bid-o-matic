const store = {
  async get(k) {
    try {
      if (window.storage) { const r = await window.storage.get(k); return r ? r.value : null; }
      return window.localStorage.getItem(k);
    } catch { return null; }
  },
  async set(k, v) {
    try {
      if (window.storage) return await window.storage.set(k, v);
      window.localStorage.setItem(k, v);
    } catch {}
  },
};

function compute(h, s) {
  const r = (s.vatRate || 0) / 100;
  const bpAmt = h * ((s.bpPct || 0) / 100), platAmt = h * ((s.platPct || 0) / 100), flat = s.flat || 0;
  const vat = (s.vatHammer ? h * r : 0) + (s.vatBp ? bpAmt * r : 0) + (s.vatPlat ? platAmt * r : 0) + (s.vatFlat ? flat * r : 0);
  return { bpAmt, platAmt, flat, vat, total: h + bpAmt + platAmt + flat + vat };
}
function maxBid(b, s) {
  const r = (s.vatRate || 0) / 100;
  const m = 1 * (1 + (s.vatHammer ? r : 0)) + ((s.bpPct || 0) / 100) * (1 + (s.vatBp ? r : 0)) + ((s.platPct || 0) / 100) * (1 + (s.vatPlat ? r : 0));
  const f = (s.flat || 0) * (1 + (s.vatFlat ? r : 0));
  return m > 0 ? Math.max(0, (b - f) / m) : 0;
}

/* ================= sound engine ================= */
function useSfx(muted) {
  const ref = useRef(null);
  const ac = () => {
    if (!ref.current) { const A = window.AudioContext || window.webkitAudioContext; ref.current = new A(); }
    if (ref.current.state === "suspended") ref.current.resume();
    return ref.current;
  };
  const note = (f, t0, dur, type = "square", vol = 0.1, f2) => {
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, c.currentTime + t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + t0 + dur);
    g.gain.setValueAtTime(0, c.currentTime + t0);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.06);
  };
  const guard = (fn) => (...a) => { if (!muted) try { fn(...a); } catch {} };
  return {
    tick: guard(() => note(900, 0, 0.035, "square", 0.035)),
    boing: guard(() => note(330, 0, 0.24, "triangle", 0.14, 85)),
    woohoo: guard(() => { note(523, 0, 0.11, "square", 0.09); note(784, 0.09, 0.1, "square", 0.1); note(1046, 0.18, 0.22, "square", 0.11); }),
    doh: guard(() => note(225, 0, 0.3, "sawtooth", 0.11, 105)),
    chaching: guard(() => { note(1319, 0, 0.07, "square", 0.07); note(1568, 0.06, 0.07, "square", 0.07); note(2093, 0.13, 0.28, "triangle", 0.1); }),
    trombone: guard(() => { [330, 294, 262, 220].forEach((f, i) => note(f, i * 0.13, 0.16, "sawtooth", 0.09)); }),
    klaxon: guard(() => { note(440, 0, 0.22, "sawtooth", 0.09, 300); note(440, 0.25, 0.22, "sawtooth", 0.09, 300); }),
    swipe: guard(() => note(500, 0, 0.09, "sine", 0.06, 950)),
  };
}

/* ================= app ================= */
function BidOMatic() {
  const [tab, setTab] = useState("calc");
  const [mode, setMode] = useState("cost");
  const [hammer, setHammer] = useState("100");
  const [budget, setBudget] = useState("500");
  const [presets, setPresets] = useState(SEED);
  const [activeId, setActiveId] = useState("p1");
  const [lots, setLots] = useState([]);
  const [cap, setCap] = useState(0);
  const [filter, setFilter] = useState("all");
  const [sheet, setSheet] = useState(null);
  const [ready, setReady] = useState(false);
  const [title, setTitle] = useState("");
  const [url, setUrl] = useState("");
  const [capDraft, setCapDraft] = useState("");
  const [newName, setNewName] = useState("");
  const [muted, setMuted] = useState(false);
  const [quote, setQuote] = useState(0);
  const sfx = useSfx(muted);

  useEffect(() => {
    (async () => {
      const raw = await store.get(KEY);
      if (raw) try {
        const d = JSON.parse(raw);
        if (d.presets?.length) setPresets(d.presets);
        if (d.activeId) setActiveId(d.activeId);
        if (d.lots) setLots(d.lots);
        if (typeof d.cap === "number") setCap(d.cap);
        if (typeof d.muted === "boolean") setMuted(d.muted);
      } catch {}
      setReady(true);
    })();
  }, []);

  const persist = (patch) => {
    const next = { presets, activeId, lots, cap, muted, ...patch };
    if (patch.presets) setPresets(patch.presets);
    if (patch.activeId) setActiveId(patch.activeId);
    if (patch.lots) setLots(patch.lots);
    if (patch.cap !== undefined) setCap(patch.cap);
    if (patch.muted !== undefined) setMuted(patch.muted);
    store.set(KEY, JSON.stringify(next));
  };

  const active = presets.find((p) => p.id === activeId) || presets[0];
  const s = active.s;
  const setFee = (patch) => persist({ presets: presets.map((p) => (p.id === active.id ? { ...p, s: { ...p.s, ...patch } } : p)) });

  const H = mode === "cost" ? parseFloat(hammer) || 0 : maxBid(parseFloat(budget) || 0, s);
  const res = useMemo(() => compute(H, s), [H, s]);
  const shown = mode === "cost" ? res.total : H;
  const feesPct = H > 0 ? ((res.total - H) / H) * 100 : 0;

  const shownLots = lots.filter((l) => filter === "all" || (l.status || "watching") === filter);
  const committed = lots.filter((l) => (l.status || "watching") === "won").reduce((a, l) => a + compute(l.hammer, l.s).total, 0);
  const exposure = lots.filter((l) => (l.status || "watching") !== "lost").reduce((a, l) => a + compute(l.hammer, l.s).total, 0);
  const overCap = cap > 0 && exposure > cap;
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };

  /* reactive sound on total change */
  const lastTotal = useRef(0);
  useEffect(() => {
    if (lastTotal.current === res.total) return;
    lastTotal.current = res.total;
    const id = setTimeout(() => {
      feesPct > 35 ? sfx.doh() : sfx.chaching();
      setQuote((q) => (q + 1) % QUOTES.length);
    }, 650);
    return () => clearTimeout(id);
  }, [res.total]); // eslint-disable-line

  const wasOver = useRef(false);
  useEffect(() => {
    if (overCap && !wasOver.current) sfx.klaxon();
    wasOver.current = overCap;
  }, [overCap]); // eslint-disable-line

  const addLot = () => {
    const h = mode === "cost" ? parseFloat(hammer) || 0 : H;
    persist({ lots: [...lots, { id: Date.now(), title: title.trim() || `Lot ${lots.length + 1}`, url: url.trim(), hammer: h, status: "watching", preset: active.name, s: { ...s } }] });
    setTitle(""); setUrl(""); setSheet(null); setTab("basket"); sfx.woohoo();
  };
  const cycle = (id) => {
    const l = lots.find((x) => x.id === id); const n = NEXT[l.status || "watching"];
    n === "won" ? sfx.woohoo() : n === "lost" ? sfx.trombone() : sfx.boing();
    persist({ lots: lots.map((x) => (x.id === id ? { ...x, status: n } : x)) });
  };
  const exportCsv = () => {
    sfx.chaching();
    const rows = [["Lot", "Status", "Auction", "URL", "Hammer", "Premium", "Platform", "Flat", "VAT", "Total"]];
    lots.forEach((l) => {
      const c = compute(l.hammer, l.s);
      rows.push([l.title, l.status || "watching", l.preset || "", l.url || "", l.hammer, c.bpAmt, c.platAmt, c.flat, c.vat, c.total].map((v) => (typeof v === "number" ? v.toFixed(2) : v)));
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" }));
    a.download = `lots-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  };

  const BD = { position: "fixed", inset: 0, background: "rgba(36,26,12,.55)", zIndex: 30 };
  const SH = { position: "absolute", left: 0, right: 0, bottom: 0, background: C.cream, borderRadius: "22px 22px 0 0", border: `4px solid ${C.ink}`, borderBottom: "none", padding: "16px 16px calc(16px + env(safe-area-inset-bottom))", maxHeight: "92%", overflowY: "auto", animation: "rise .22s ease" };
  const lbl = { display: "block", fontFamily: C.body, fontWeight: 900, fontSize: 10, letterSpacing: ".1em", textTransform: "uppercase", color: C.blue, marginBottom: 3 };
  const bigBtn = { width: "100%", padding: 12, borderRadius: 14, border: `3px solid ${C.ink}`, background: C.yellow, color: C.ink, fontFamily: C.disp, fontSize: 17, cursor: "pointer", boxShadow: `3px 3px 0 ${C.ink}` };

  return (
    <div style={{
      height: "100dvh", overflow: "hidden", position: "relative", display: "flex", flexDirection: "column",
      background: `linear-gradient(180deg,${C.sky} 0%,${C.sky2} 46%,${C.yellow} 46.2%,${C.yellow} 100%)`,
      fontFamily: C.body, color: C.ink,
      paddingLeft: "env(safe-area-inset-left)", paddingRight: "env(safe-area-inset-right)",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap');
        input[type=number]::-webkit-inner-spin-button{display:none}
        input[type=number]{-moz-appearance:textfield}
        *{-webkit-tap-highlight-color:transparent}
        ::-webkit-scrollbar{width:0;height:0}
        @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
        @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
        @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(105vw)}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
      `}</style>

      {/* clouds */}
      {[0, 1, 2].map((i) => (
        <div key={i} aria-hidden style={{
          position: "absolute", top: 16 + i * 40, left: 0, width: 92 - i * 16, height: 28, background: "#fff",
          borderRadius: 999, boxShadow: "20px -9px 0 -4px #fff,-18px -7px 0 -6px #fff", opacity: .92,
          animation: `drift ${64 + i * 22}s linear infinite`, animationDelay: `${-i * 21}s`, pointerEvents: "none",
        }} />
      ))}
      {/* Simpson family - fixed corners */}
      <img src={IMG.marge} alt="Marge" style={{ position: "fixed", top: "calc(6px + env(safe-area-inset-top))", left: 6, zIndex: 0, width: "clamp(50px, 16vw, 84px)", opacity: 0.9, pointerEvents: "none", filter: `drop-shadow(3px 3px 0 rgba(36,26,12,.25))` }} />
      <img src={IMG.maggie} alt="Maggie" style={{ position: "fixed", top: "calc(6px + env(safe-area-inset-top))", right: 6, zIndex: 0, width: "clamp(40px, 13vw, 68px)", opacity: 0.9, pointerEvents: "none", filter: `drop-shadow(3px 3px 0 rgba(36,26,12,.25))` }} />
      {tab === "calc" && (
        <img src={IMG.bart} alt="Bart" style={{ position: "fixed", bottom: "clamp(72px, 16vh, 100px)", right: 6, zIndex: 0, width: "clamp(76px, 24vw, 130px)", opacity: 0.95, pointerEvents: "none", filter: `drop-shadow(4px 4px 0 rgba(36,26,12,.25))` }} />
      )}
      <Towers />

      {/* ---------- header ---------- */}
      <div style={{ padding: "calc(14px + env(safe-area-inset-top)) 14px 8px", flexShrink: 0, position: "relative" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 16 }}>
          <div style={{ fontFamily: C.disp, fontSize: 24, color: C.yellow, WebkitTextStroke: `2px ${C.ink}`, textShadow: `3px 3px 0 ${C.red}`, lineHeight: 1 }}>
            BID-O-MATIC
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={() => { persist({ muted: !muted }); }} aria-label={muted ? "Unmute" : "Mute"}
              style={{ background: "#fff", border: `2.5px solid ${C.ink}`, borderRadius: 10, minWidth: 44, minHeight: 44, fontSize: 16, cursor: "pointer" }}>
              {muted ? "🔇" : "🔊"}
            </button>
            <button onClick={() => { setSheet("fees"); sfx.swipe(); }}
              style={{ background: "#fff", border: `2.5px solid ${C.ink}`, borderRadius: 10, minHeight: 44, padding: "0 12px", fontFamily: C.body, fontWeight: 900, fontSize: 12, cursor: "pointer", color: C.ink }}>
              {s.bpPct}%+{s.platPct}% ⚙
            </button>
          </div>
        </div>

        <div style={{ display: "flex", gap: 3, background: "rgba(255,255,255,.75)", border: `3px solid ${C.ink}`, borderRadius: 13, padding: 3, marginTop: 9, boxShadow: `3px 3px 0 rgba(36,26,12,.25)` }}>
          <Tab on={tab === "calc"} onClick={() => { setTab("calc"); sfx.swipe(); }}>Calculator</Tab>
          <Tab on={tab === "basket"} onClick={() => { setTab("basket"); sfx.swipe(); }}>Basket{lots.length ? ` (${lots.length})` : ""}</Tab>
        </div>
      </div>

      {/* ---------- CALC ---------- */}
      {tab === "calc" && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "0 14px calc(14px + env(safe-area-inset-bottom))", minHeight: 0, position: "relative" }}>
          <div style={{ display: "flex", gap: 6, marginBottom: 8, flexShrink: 0 }}>
            <Chip on={mode === "cost"} onClick={() => { setMode("cost"); sfx.swipe(); }}>What'll it cost?</Chip>
            <Chip on={mode === "budget"} onClick={() => { setMode("budget"); sfx.swipe(); }}>Max bid</Chip>
          </div>

          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 3, marginBottom: 9, flexShrink: 0 }}>
            {presets.map((p) => (
              <Chip key={p.id} tiny on={p.id === activeId} onClick={() => { persist({ activeId: p.id }); sfx.boing(); }}>{p.name}</Chip>
            ))}
            <Chip tiny on={false} onClick={() => { setSheet("fees"); sfx.swipe(); }}>+ New</Chip>
          </div>

          <Field label={mode === "cost" ? "Hammer price" : "Your all-in budget"} prefix="£" sfx={sfx}
            value={mode === "cost" ? hammer : budget} onChange={mode === "cost" ? setHammer : setBudget} />

          <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", minHeight: 0, padding: "4px 0" }}>
            <div style={{ fontFamily: C.body, fontWeight: 900, fontSize: 10.5, letterSpacing: ".12em", textTransform: "uppercase", color: C.brown }}>
              {mode === "cost" ? "You'll actually pay" : "Stop bidding at"}
            </div>
            <div key={res.total.toFixed(2)} style={{
              fontFamily: C.disp, fontSize: "clamp(36px,12.5vw,54px)", lineHeight: 1.08,
              color: mode === "cost" ? "#fff" : C.green, WebkitTextStroke: `2.5px ${C.ink}`,
              textShadow: `4px 4px 0 ${mode === "cost" ? C.red : C.ink}`, animation: "pop .3s ease",
            }}>{gbp(shown)}</div>
            <div style={{ fontWeight: 900, fontSize: 12, color: C.brown, marginTop: 3 }}>
              +{feesPct.toFixed(1)}% in fees{feesPct > 35 ? " · D'OH!" : ""}
            </div>

            <div style={{ display: "flex", width: "100%", height: 12, borderRadius: 999, overflow: "hidden", marginTop: 11, border: `2.5px solid ${C.ink}`, background: "#fff" }}>
              {[[H, C.yellow], [res.bpAmt, C.purple], [res.platAmt, "#ff9b3d"], [res.flat, C.brown], [res.vat, C.pink]].map(([v, col], i) => (
                <div key={i} style={{ width: `${res.total > 0 ? (v / res.total) * 100 : 0}%`, background: col, transition: "width .25s" }} />
              ))}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: "3px 11px", marginTop: 7, justifyContent: "center", fontSize: 10.5, fontWeight: 900, color: C.ink }}>
              {[["Hammer", H, C.yellow], ["Premium", res.bpAmt, C.purple], ["Platform", res.platAmt, "#ff9b3d"], ["VAT", res.vat, C.pink]].map(([n, v, col]) => (
                <span key={n} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                  <i style={{ width: 8, height: 8, borderRadius: 999, background: col, border: `1.5px solid ${C.ink}`, display: "inline-block" }} />{n} {gbp(v, true)}
                </span>
              ))}
            </div>

            {/* speech bubble */}
            <div style={{ position: "relative", marginTop: 12, background: "#fff", border: `3px solid ${C.ink}`, borderRadius: 14, padding: "7px 12px", fontWeight: 800, fontSize: 12.5, fontStyle: "italic", maxWidth: "100%", textAlign: "center" }}>
              “{QUOTES[quote]}”
              <span style={{ position: "absolute", bottom: -11, left: 22, width: 0, height: 0, borderLeft: "9px solid transparent", borderRight: "9px solid transparent", borderTop: `11px solid ${C.ink}` }} />
            </div>
          </div>

          <button onClick={() => { setSheet("add"); sfx.swipe(); }} style={{ ...bigBtn, background: C.pink, flexShrink: 0 }}>
            🛒 Add to basket
          </button>
        </div>
      )}

      {/* ---------- BASKET ---------- */}
      {tab === "basket" && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "0 14px calc(14px + env(safe-area-inset-bottom))", minHeight: 0, position: "relative" }}>
          <button onClick={() => { setCapDraft(cap ? String(cap) : ""); setSheet("cap"); sfx.swipe(); }} style={{
            textAlign: "left", padding: "11px 13px", borderRadius: 16, cursor: "pointer", flexShrink: 0, color: C.ink,
            background: overCap ? C.red : "#fff", border: `4px solid ${C.ink}`, boxShadow: `4px 4px 0 rgba(36,26,12,.3)`,
            animation: overCap ? "shake .4s ease" : "none",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
              <span style={{ fontWeight: 900, fontSize: 9.5, letterSpacing: ".12em", textTransform: "uppercase", color: overCap ? "#ffe9e7" : C.brown }}>
                On the hook for
              </span>
              <span style={{ fontWeight: 900, fontSize: 10.5, color: overCap ? "#ffe9e7" : C.blue }}>{cap > 0 ? `cap ${gbp(cap, true)}` : "tap to set cap"}</span>
            </div>
            <div style={{ fontFamily: C.disp, fontSize: 30, lineHeight: 1.12, color: overCap ? "#fff" : C.ink, WebkitTextStroke: overCap ? `2px ${C.ink}` : "none" }}>
              {gbp(exposure, true)}
            </div>
            {cap > 0 && (
              <div style={{ height: 8, borderRadius: 999, background: "rgba(36,26,12,.12)", overflow: "hidden", marginTop: 4, border: `2px solid ${C.ink}` }}>
                <div style={{ width: `${Math.min(100, (exposure / cap) * 100)}%`, height: "100%", background: overCap ? C.yellow : C.green, transition: "width .3s" }} />
              </div>
            )}
            <div style={{ fontWeight: 800, fontSize: 11, color: overCap ? "#ffe9e7" : C.brown, marginTop: 4 }}>
              {gbp(committed, true)} committed on won lots{overCap ? ` · ${gbp(exposure - cap, true)} OVER. D'oh!` : ""}
            </div>
          </button>

          <div style={{ display: "flex", gap: 5, margin: "9px 0 7px", overflowX: "auto", flexShrink: 0 }}>
            {["all", "watching", "won", "lost"].map((f) => (
              <Chip key={f} tiny on={filter === f} onClick={() => { setFilter(f); sfx.swipe(); }}>
                {f === "all" ? "🍩 All" : `${STATUS[f].emoji} ${STATUS[f].label}`}
              </Chip>
            ))}
          </div>

          <div style={{ flex: 1, overflowY: "auto", minHeight: 0 }}>
            {!ready ? <p style={{ textAlign: "center", fontWeight: 800, color: C.brown, marginTop: 20 }}>Loading…</p>
              : shownLots.length === 0 ? (
                <div style={{ textAlign: "center", marginTop: 12 }}>
                  <img src={IMG.lovejoy} alt="Reverend Lovejoy" style={{ width: "clamp(110px, 38vw, 170px)", filter: `drop-shadow(4px 4px 0 rgba(36,26,12,.25))` }} />
                  <p style={{ fontWeight: 800, color: C.brown, marginTop: 6, lineHeight: 1.6, fontSize: 13 }}>
                    Nothing here.<br />Go work out a lot, you magnificent bidder.
                  </p>
                </div>
              ) : shownLots.map((l) => {
                const c = compute(l.hammer, l.s); const st = STATUS[l.status || "watching"];
                return (
                  <div key={l.id} style={{
                    display: "flex", alignItems: "center", gap: 9, padding: "9px 11px", background: "#fff",
                    border: `3px solid ${C.ink}`, borderRadius: 14, marginBottom: 7, boxShadow: `3px 3px 0 rgba(36,26,12,.22)`,
                    opacity: l.status === "lost" ? .55 : 1,
                  }}>
                    <button onClick={() => cycle(l.id)} aria-label={`Status ${st.label}, tap to change`}
                      style={{ background: st.col, border: `2.5px solid ${C.ink}`, borderRadius: 10, width: 38, height: 38, fontSize: 16, cursor: "pointer", flexShrink: 0, padding: 0 }}>
                      {st.emoji}
                    </button>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 900, fontSize: 13.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", textDecoration: l.status === "lost" ? "line-through" : "none" }}>{l.title}</div>
                      <div style={{ fontWeight: 800, fontSize: 10.5, color: C.brown, marginTop: 1 }}>
                        {gbp(l.hammer, true)} hammer{l.url ? ` · ${host(l.url)}` : ""}
                      </div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <div style={{ fontFamily: C.disp, fontSize: 16, lineHeight: 1.2 }}>{gbp(c.total, true)}</div>
                      <div style={{ display: "flex", gap: 4, justifyContent: "flex-end" }}>
                        {l.url && <a href={l.url} target="_blank" rel="noreferrer" style={{ fontSize: 10, fontWeight: 900, color: C.blue, textDecoration: "none", padding: "6px 4px" }}>open ↗</a>}
                        <button onClick={() => { persist({ lots: lots.filter((x) => x.id !== l.id) }); sfx.trombone(); }}
                          style={{ background: "none", border: "none", color: C.red, fontSize: 10, fontWeight: 900, cursor: "pointer", padding: "6px 4px" }}>bin it</button>
                      </div>
                    </div>
                  </div>
                );
              })}
          </div>

          {lots.length > 0 && (
            <button onClick={exportCsv} style={{ ...bigBtn, background: "#fff", fontSize: 14, marginTop: 7, flexShrink: 0 }}>📄 Export CSV</button>
          )}
        </div>
      )}

      {/* ---------- FEES SHEET ---------- */}
      {sheet === "fees" && (
        <div style={BD} onClick={() => setSheet(null)}>
          <div style={SH} onClick={(e) => e.stopPropagation()}>
            <div style={{ width: 40, height: 5, borderRadius: 99, background: "rgba(36,26,12,.25)", margin: "0 auto 12px" }} />
            <div style={{ fontFamily: C.disp, fontSize: 20, color: C.blue, marginBottom: 9 }}>Auction houses</div>
            <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4, marginBottom: 11 }}>
              {presets.map((p) => <Chip key={p.id} tiny on={p.id === activeId} onClick={() => { persist({ activeId: p.id }); sfx.boing(); }}>{p.name}</Chip>)}
            </div>
            <div style={{ display: "flex", gap: 7, marginBottom: 13 }}>
              <Text value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="New house (e.g. Wessex)" />
              <button onClick={() => {
                if (!newName.trim()) return;
                const id = "p" + Date.now();
                persist({ presets: [...presets, { id, name: newName.trim(), s: { ...s } }], activeId: id });
                setNewName(""); sfx.woohoo();
              }} style={{ padding: "0 15px", borderRadius: 12, border: `3px solid ${C.ink}`, background: C.green, color: "#fff", fontFamily: C.disp, fontSize: 15, cursor: "pointer", flexShrink: 0 }}>Save</button>
            </div>

            <div style={{ fontWeight: 900, fontSize: 12, color: C.brown, marginBottom: 7 }}>Editing: {active.name}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9, marginBottom: 10 }}>
              <Field label="Buyer's premium" suffix="%" step={.5} value={s.bpPct} sfx={sfx} onChange={(v) => setFee({ bpPct: parseFloat(v) || 0 })} />
              <Field label="Platform fee" suffix="%" step={.05} value={s.platPct} sfx={sfx} onChange={(v) => setFee({ platPct: parseFloat(v) || 0 })} />
              <Field label="Flat lot fee" prefix="£" step={.5} value={s.flat} sfx={sfx} onChange={(v) => setFee({ flat: parseFloat(v) || 0 })} />
              <Field label="VAT rate" suffix="%" step={.5} value={s.vatRate} sfx={sfx} onChange={(v) => setFee({ vatRate: parseFloat(v) || 0 })} />
            </div>
            <div style={{ display: "grid", gap: 6 }}>
              <VatToggle on={s.vatHammer} sfx={sfx} onChange={(v) => setFee({ vatHammer: v })} label="VAT on hammer (VAT-able lot)" />
              <VatToggle on={s.vatBp} sfx={sfx} onChange={(v) => setFee({ vatBp: v })} label="VAT on buyer's premium" />
              <VatToggle on={s.vatPlat} sfx={sfx} onChange={(v) => setFee({ vatPlat: v })} label="VAT on platform fee" />
              <VatToggle on={s.vatFlat} sfx={sfx} onChange={(v) => setFee({ vatFlat: v })} label="VAT on flat fee" />
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 13 }}>
              {presets.length > 1 && (
                <button onClick={() => { const rest = presets.filter((p) => p.id !== active.id); persist({ presets: rest, activeId: rest[0].id }); sfx.trombone(); }}
                  style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 15px", borderRadius: 13, border: `3px solid ${C.ink}`, background: "#fff", color: C.red, fontFamily: C.disp, fontSize: 15, cursor: "pointer" }}>
                  <img src={IMG.itchyscratchy} alt="" style={{ width: "clamp(30px, 10vw, 42px)", height: "clamp(30px, 10vw, 42px)", borderRadius: 8, flexShrink: 0 }} />Delete
                </button>
              )}
              <button onClick={() => { setSheet(null); sfx.swipe(); }} style={{ ...bigBtn, flex: 1 }}>Done</button>
            </div>
          </div>
        </div>
      )}

      {/* ---------- ADD SHEET ---------- */}
      {sheet === "add" && (
        <div style={BD} onClick={() => setSheet(null)}>
          <div style={SH} onClick={(e) => e.stopPropagation()}>
            <div style={{ width: 40, height: 5, borderRadius: 99, background: "rgba(36,26,12,.25)", margin: "0 auto 12px" }} />
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <img src={IMG.lisa} alt="Lisa" style={{ width: "clamp(60px, 20vw, 90px)", flexShrink: 0, filter: `drop-shadow(3px 3px 0 rgba(36,26,12,.25))` }} />
              <div style={{ fontFamily: C.disp, fontSize: 20, color: C.blue }}>Track this lot</div>
            </div>
            <div style={{ fontWeight: 800, fontSize: 12, color: C.brown, margin: "3px 0 12px" }}>
              {gbp(mode === "cost" ? parseFloat(hammer) || 0 : H)} hammer on {active.name} · {gbp(res.total)} all-in.
            </div>
            <div style={{ marginBottom: 9 }}>
              <span style={lbl}>Name</span>
              <Text value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Lot 214 — oak sideboard" />
            </div>
            <div>
              <span style={lbl}>Listing URL (optional)</span>
              <Text value={url} onChange={(e) => setUrl(e.target.value)} placeholder="paste the i-bidder link" />
            </div>
            <button onClick={addLot} style={{ ...bigBtn, marginTop: 13, background: C.pink }}>Save to basket</button>
          </div>
        </div>
      )}

      {/* ---------- CAP SHEET ---------- */}
      {sheet === "cap" && (
        <div style={BD} onClick={() => setSheet(null)}>
          <div style={SH} onClick={(e) => e.stopPropagation()}>
            <div style={{ width: 40, height: 5, borderRadius: 99, background: "rgba(36,26,12,.25)", margin: "0 auto 12px" }} />
            <div style={{ fontFamily: C.disp, fontSize: 20, color: C.blue }}>Spending cap</div>
            <div style={{ fontWeight: 800, fontSize: 12, color: C.brown, margin: "3px 0 12px" }}>
              Total all-in across everything you haven't lost. Go over and the app shouts at you. Set 0 to switch it off.
            </div>
            <Field label="Cap" prefix="£" value={capDraft} onChange={setCapDraft} sfx={sfx} />
            <button onClick={() => { persist({ cap: parseFloat(capDraft) || 0 }); setSheet(null); sfx.woohoo(); }} style={{ ...bigBtn, marginTop: 13 }}>Set it</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BidOMatic />);
</script>
</body>
</html>
